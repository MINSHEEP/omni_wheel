# MID360 履带专用 Nav2 参数。运动、安全余量和行为树沿用已标定履带配置。
# FAST-LIO2 内部 iEKF 给出三维本地里程计，Nav2 消费其底盘坐标适配结果。
# /scan_mid360 是经高度/机体过滤的二维投影；无观测角度必须保留为未知。
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.4
    alpha4: 0.4
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_mid360
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    # 与 /scan_mid360 投影器一致；近距 0.5 m 服从 FAST-LIO2 blind 设置。
    # 20 m 是导航投影上限，不是 MID360 的硬件量程上限。
    laser_min_range: 0.5
    laser_max_range: 20.0
    laser_likelihood_max_dist: 1.0
    max_beams: 120
    z_hit: 0.75
    z_rand: 0.2
    z_short: 0.03
    z_max: 0.02
    sigma_hit: 0.15
    lambda_short: 0.1
    min_particles: 1000
    max_particles: 5000
    pf_err: 0.03
    pf_z: 0.99
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    transform_tolerance: 0.5
    tf_broadcast: true
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    save_pose_rate: 0.5
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /fastlio/odom_base
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: ''
    default_nav_through_poses_bt_xml: ''
    wait_for_service_timeout: 1000
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    odom_topic: /fastlio/odom_base
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.12
      required_movement_angle: 0.15
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.4
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.15
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 0.4
      simulate_ahead_time: 1.0
      closed_loop: false
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.15
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.15
      acc_lim_y: 0.0
      acc_lim_theta: 0.4
      decel_lim_x: -0.2
      decel_lim_y: 0.0
      decel_lim_theta: -0.6
      vx_samples: 8
      vy_samples: 1
      vtheta_samples: 16
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.15
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.5
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.5
      PathDist.scale: 20.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.48
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_mid360
          data_type: LaserScan
          clearing: true
          marking: true
          # 非重复扫描的空角度不代表可通行射线，禁止用 Inf 清除未知障碍。
          inf_is_valid: false
          obstacle_min_range: 0.5
          obstacle_max_range: 8.0
          raytrace_min_range: 0.5
          raytrace_max_range: 10.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.85
        cost_scaling_factor: 2.0
      always_send_full_costmap: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.48
      track_unknown_space: false
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_mid360
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          obstacle_min_range: 0.5
          obstacle_max_range: 8.0
          raytrace_min_range: 0.5
          raytrace_max_range: 10.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.85
        cost_scaling_factor: 2.0
      always_send_full_costmap: false
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_theta_star_planner/ThetaStarPlanner
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 3.0
      allow_unknown: true
      use_final_approach_orientation: false
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - constrained_smoother
    constrained_smoother:
      plugin: nav2_constrained_smoother/ConstrainedSmoother
      reversing_enabled: false
      minimum_turning_radius: 0.0
      path_downsampling_factor: 2
      path_upsampling_factor: 1
      keep_start_orientation: false
      keep_goal_orientation: false
      w_curve: 0.0
      w_dist: 0.0
      w_smooth: 2000000.0
      w_cost: 0.02
      optimizer:
        max_iterations: 50
        debug_optimizer: false
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.4
    behavior_plugins:
    - spin
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.15
    - 0.0
    - 0.4
    min_velocity:
    - 0.0
    - 0.0
    - -0.4
    max_accel:
    - 0.15
    - 0.0
    - 0.4
    max_decel:
    - -0.2
    - 0.0
    - -0.6
    odom_topic: /fastlio/odom_base
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.2
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
