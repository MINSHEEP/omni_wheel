# PaceCat LDS-E110-R parameters for the existing bluesea2 UART SDK.
# 当前使用 E110-R 10 Hz 变体（R-1/R-3）：固定输出 400 点，避免 N 变化造成角度跳变。
bluesea_node:
  ros__parameters:
    use_sim_time: false
    frame_id: lidar_link
    scan_topic: /scan
    cloud_topic: /cloud

    type: uart
    port: /dev/ttyUSB0
    baud_rate: 230400
    dev_id: -1
    raw_bytes: 3

    output_360: true
    scan_points: 400
    output_scan: true
    output_cloud: false
    output_cloud2: false
    with_angle_filter: true
    min_angle: -1.5707963
    max_angle: 1.5707963
    from_zero: false
    inverted: false
    reversed: true

    min_dist: 0.1
    max_dist: 12.0
    with_checksum: true
    hard_resample: false
    soft_resample: false
    error_circle: 3
    error_scale: 0.90
    time_mode: 0

    # E110 manual does not require host-side setup commands; keep all optional commands disabled.
    uuid: -1
    resample_res: -1.0
    unit_is_mm: -1
    with_confidence: -1
    with_smooth: -1
    with_deshadow: -1
    alarm_msg: -1
    rpm: -1
    direction: -1
    ats: -1

    # 仅删除单帧孤立回波；不做跨帧平滑，避免运动时产生拖影。
    filter_open: true
    filter_type: 1
    # 滤波器范围必须与 E110 的实际测距范围一致，不能使用 SDK 默认的 0.5/20 m。
    min_range: 0.05
    max_range: 12.0
    max_range_difference: 0.25
    filter_window: 1
    log_enable: false
    log_path: /tmp/lds_e110_sdk.log
