kiwi_slam_monitor:
  ros__parameters:
    use_sim_time: false
    scan_topic: /scan
    odom_topic: /odometry/filtered
    map_topic: /map
    laser_frame: lidar_link
    base_frame: base_footprint
    odom_frame: odom
    map_frame: map
    timeout_sec: 1.0
    map_timeout_sec: 5.0
    min_valid_scan_ratio: 0.10
    require_map_tf: true
    debug_log: true
