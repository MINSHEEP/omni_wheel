kiwi_mapping_scan_gate:
  ros__parameters:
    use_sim_time: false
    input_scan_topic: /scan
    output_scan_topic: /scan_slam
    odom_topic: /odometry/filtered
    require_imu_ready: false
    imu_ready_topic: /chassis/imu/calibration_ready
    gate_ready_topic: /kiwi_slam/mapping_gate_ready
    laser_frame: lidar_link
    odom_frame: odom
    base_frame: base_footprint
    stationary_duration_s: 0.5
    max_linear_speed_m_s: 0.03
    max_angular_speed_rad_s: 0.04
    max_yaw_step_rad: 0.015
    max_message_age_s: 0.25
    required_stable_scans: 5
    min_valid_scan_ratio: 0.10
    min_scan_overlap_ratio: 0.50
    max_median_range_delta_m: 0.05
