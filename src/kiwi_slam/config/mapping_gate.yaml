kiwi_mapping_scan_gate:
  ros__parameters:
    use_sim_time: false
    # /scan 继续供 RViz、Nav2 和诊断使用；只给 SLAM 增加内部受控输入。
    input_scan_topic: /scan
    output_scan_topic: /scan_slam
    odom_topic: /odometry/filtered
    imu_ready_topic: /chassis/imu/calibration_ready
    gate_ready_topic: /kiwi_slam/mapping_gate_ready
    laser_frame: lidar_link
    odom_frame: odom
    base_frame: base_footprint

    # 底盘实际标定完成后仍连续静止 0.5 s，再开始统计相邻完整扫描。
    stationary_duration_s: 0.5
    max_linear_speed_m_s: 0.02
    max_angular_speed_rad_s: 0.03
    # 相邻 EKF 消息的 yaw 最大变化，使用 remainder 跨 ±pi 比较。
    max_yaw_step_rad: 0.01
    max_message_age_s: 0.20

    # M10P 约 12 Hz；连续 8 帧约 0.67 s，可排除启动瞬态且不长期阻塞建图。
    required_stable_scans: 8
    min_valid_scan_ratio: 0.10
    min_scan_overlap_ratio: 0.50
    max_median_range_delta_m: 0.05
