# Online synchronous mapping for LSLIDAR M10P and the tracked RF2O + IMU EKF odometry.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    # /scan 保留原始传感器契约；首帧门控只向内部 /scan_slam 放行已经完成
    # 激光里程计及 IMU 连续新鲜、静止且相邻帧一致的扫描，防止坏首帧成为永久图节点。
    scan_topic: /scan_slam
    mode: mapping
    use_map_saver: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # 栅格刷新与12Hz扫描/30Hz位姿是不同频率；0.5s降低可见的阶梯式刷新。
    map_update_interval: 0.5
    resolution: 0.05
    # 与驱动 LaserScan.range_min 完全一致，避免启动阶段把雷达盲区误当有效能力。
    min_laser_range: 0.15
    max_laser_range: 12.0
    minimum_time_interval: 0.05
    transform_timeout: 0.20
    # 实测 /scan_slam 为 12 Hz，而 EKF 的 odom→base TF 覆盖扫描时间戳
    # 通常晚约 0.10 s、95 分位晚约 0.13 s；默认 1 帧队列会持续丢扫描，
    # 导致 map→odom 停留在旧时间戳。允许等待足够多的扫描帧。
    scan_queue_size: 10
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    # 拉大关键帧间距，避免短基线节点过密导致 CPU 过载和误闭环。
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.20
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 1.5

    # 恢复自动回环；仅接收校准和激光质量门控后的扫描。回环精度仍需新场地验收。
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_fine: 0.6

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.10
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.10
