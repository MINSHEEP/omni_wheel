# 履带无编码器：RF2O 只发激光里程计消息；TF 由 EKF 独占发布。
rf2o_laser_odometry:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /chassis/odom/laser
    publish_tf: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    # 上游默认等待 /base_pose_ground_truth；实车没有此话题，空值从原点初始化。
    init_pose_from_topic: ""
    freq: 20.0
