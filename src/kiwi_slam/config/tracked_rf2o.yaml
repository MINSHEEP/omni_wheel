# 履带无编码器：RF2O 只发激光里程计消息；TF 由 EKF 独占发布。
rf2o_laser_odometry:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /chassis/odom/laser_raw
    publish_tf: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    # 上游默认等待 /base_pose_ground_truth；实车没有此话题，空值从原点初始化。
    init_pose_from_topic: ""
    freq: 20.0

rf2o_covariance_adapter:
  ros__parameters:
    source_topic: /chassis/odom/laser_raw
    output_topic: /chassis/odom/laser
    odom_frame: odom
    base_frame: base_footprint
    # 试验性保守方差；RF2O 无编码器参考，不能以全零协方差进入 EKF。
    # 这不等于已验证长走廊纵向精度，仍需要独立里程源。
    pose_xy_variance: 0.25
    pose_yaw_variance: 0.01
    twist_vx_variance: 0.04
    twist_vy_variance: 0.01
    twist_wz_variance: 0.04
    # 静止两秒内扫描、IMU 和 RF2O 位移同时稳定时，固定发布位姿；运动后连续续接。
    # 2026-09-25 静止 bag 实测：原始扫描 2 s 中位差约 6 mm，
    # RF2O 129 s 漂移 11.7 cm/2.8°，此约束仅用于履带。
    stationary_filter_enabled: true
    scan_topic: /scan
    imu_topic: /chassis/imu/data_raw
    stationary_window_s: 2.0
    stationary_max_scan_median_delta_m: 0.012
    stationary_min_scan_overlap_ratio: 0.75
    stationary_min_valid_scan_ratio: 0.2
    stationary_max_translation_m: 0.02
    stationary_max_yaw_rad: 0.01
    stationary_max_gyro_rms_rad_s: 0.012
    stationary_max_sensor_age_s: 0.25
