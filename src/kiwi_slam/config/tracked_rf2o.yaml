# 履带无编码器：RF2O 只发激光里程计消息；TF 由 EKF 独占发布。
rf2o_laser_odometry:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /chassis/odom/laser_raw
    publish_tf: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    # 上游默认等待 /base_pose_ground_truth；实车没有此话题，空值从原点初始化。
    init_pose_from_topic: ""
    freq: 20.0

rf2o_covariance_adapter:
  ros__parameters:
    source_topic: /chassis/odom/laser_raw
    output_topic: /chassis/odom/laser
    odom_frame: odom
    base_frame: base_footprint
    # 试验性保守方差；RF2O 无编码器参考，不能以全零协方差进入 EKF。
    # 这不等于已验证长走廊纵向精度，仍需要独立里程源。
    pose_xy_variance: 0.25
    pose_yaw_variance: 0.01
    twist_vx_variance: 0.04
    twist_vy_variance: 0.01
    twist_wz_variance: 0.04
