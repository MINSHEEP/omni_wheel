livox_lidar_publisher:
  ros__parameters:
    use_sim_time: false
    # 1 = livox_ros_driver2/msg/CustomMsg，FAST-LIO2 需要逐点时间戳。
    xfer_format: 1
    multi_topic: 0
    data_src: 0
    publish_freq: 10.0
    output_data_type: 0
    frame_id: livox_frame
    cmdline_input_bd_code: livox0000000001
    # user_config_path 由 launch 注入已安装包内 mid360s_network.json 的绝对路径。
