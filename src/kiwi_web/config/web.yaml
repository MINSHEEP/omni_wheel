# Device-local HTTP + WebSocket server. All browser assets are served offline.
host: 0.0.0.0
port: 8080
# Keep this chassis isolated from other ROS projects on the LAN.
# An explicitly exported ROS_DOMAIN_ID takes precedence.
ros_domain_id: 42
# Empty infers the workspace from this package's colcon install prefix.
# Relative data/config paths resolve against that workspace, never cwd.
workspace: ""
maps_dir: maps
# Optional shared access password (or KIWI_WEB_TOKEN environment variable).
# Empty permits access from the trusted LAN; cross-origin writes are rejected.
access_token: ""
max_clients: 8
# Manual speed ceilings. Also bounded by the base's configured physical limits.
manual_linear: 0.4
manual_lateral: 0.4
manual_angular: 0.6
# Optional absolute or workspace-relative paths. Empty uses each package's
# installed config; do not copy hardware/algorithm values here.
# 空值使用 kiwi_platform/config/active_platform.yaml 当前底盘。
platform_file: ""
base_params_file: ""
lidar_params_file: ""
slam_params_file: ""
mapping_gate_params_file: ""
monitor_params_file: ""
nav2_params_file: ""
