# kiwi_base 唯一运行参数文件（ROS 2 Humble）。
# 需要修改设备、话题、默认减速比或发布格式时，只改本文件。
kiwi_base_node:
  ros__parameters:
    # USB CDC 设备。没有硬件时节点仍可启动，但不会产生 TX 日志。
    device: /dev/robomaster_c
    publish_rate: 50.0
    log_serial_frames: false

    # 反馈电机数值 -> 轮输出轴 rad/s 的倍率。
    # 若 C 板回传的是电机轴 rad/s，保持 1.0；主机随后除以 19。
    feedback_motor_scale_to_rad_s: 1.0
    motor_reduction_ratio: [19.0, 19.0, 19.0]

    # 实车几何：203 mm 轮径；中心到轮心距离 322.56 mm。
    wheel_radius_m: 0.1015
    wheel_center_distance_m: 0.32256

    # /cmd_vel_safe 入口限幅：分别对应前后、左右和旋转速度的绝对值上限。
    max_linear_speed_m_s: 0.6
    max_lateral_speed_m_s: 0.6
    max_angular_speed_rad_s: 1.5

    # 测量协方差对角线（方差，不是标准差），顺序均为 x、y、z。
    # 当前是保守初值；完成静止和匀速采样后再用实测方差替换。
    wheel_pose_variance: [0.10, 0.10, 0.20]
    wheel_twist_variance: [0.02, 0.02, 0.04]
    imu_orientation_variance: [0.05, 0.05, 0.20]
    imu_angular_velocity_variance: [0.01, 0.01, 0.01]
    imu_linear_acceleration_variance: [0.10, 0.10, 0.10]

    # ROS 话题入口；Nav2、键盘或测试脚本只需要发布 cmd_vel_topic。
    cmd_vel_topic: /cmd_vel_safe
    wheel_odom_topic: /wheel/odom_raw
    imu_topic: /imu/data_raw
    joint_states_topic: /joint_states

    # ROS 坐标和关节名称。
    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: imu_link
    wheel_names: [wheel_joint_1, wheel_joint_2, wheel_joint_3]

# 暂不启用：加速度斜坡、命令超时、反馈联锁和软件急停。

# 平面 EKF：只融合轮速 vx/vy 和 IMU gyro_z，避免重复融合轮速积分得到的位姿。
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.20
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odom_raw
    # robot_localization 状态顺序：
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # 每项 true 表示参与 EKF，false 表示忽略。
    # 轮式里程计只提供机体 vx、vy；不重复融合其积分位姿和 wz。
    odom0_config: [
      false, false, false,  # x, y, z：不使用轮式积分位置
      false, false, false,  # roll, pitch, yaw：不使用轮式积分姿态
      true,  true,  false,  # vx, vy, vz：只使用 vx、vy
      false, false, false,  # vroll, vpitch, vyaw：不使用轮速角速度
      false, false, false   # ax, ay, az：轮式里程计不提供加速度
    ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data_raw
    # robot_localization 的状态顺序（共 15 项）：
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # 每项 true 表示参与 EKF，false 表示忽略；当前只融合 IMU 的 Z 轴角速度 vyaw。
    imu0_config: [
      false, false, false,  # x, y, z：IMU 不提供位置
      false, false, false,  # roll, pitch, yaw：不直接融合 IMU 姿态四元数
      false, false, false,  # vx, vy, vz：IMU 不提供线速度
      false, false, true,   # vroll, vpitch, vyaw：只使用 gyro_z
      false, false, false   # ax, ay, az：当前不使用线性加速度
    ]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
