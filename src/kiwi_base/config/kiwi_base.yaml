# Kiwi 底盘唯一参数入口（ROS 2 Humble）。
# 底盘、EKF、键盘、调试节点和结构尺寸均在本文件维护。
kiwi_base_node:
  ros__parameters:
    use_sim_time: false
    # USB CDC 设备。没有硬件时节点仍可启动，但不会产生 TX 日志。
    device: /dev/robomaster_c
    publish_rate: 50.0
    # 关闭逐帧终端日志，避免 I/O 造成运行卡顿。
    log_serial_frames: false
    # 硬件契约：0x3A 命令没有 ACK，控制循环不得等待应答；C 板会异步上报
    # 0x3B 电机/IMU 遥测，节点只做非阻塞读取，遥测中断不阻断命令发送。
    feedback_framed: true
    # /cmd_vel 发布中断后最多保持该时长，超时由 50 Hz 控制循环主动归零。
    cmd_vel_timeout_s: 0.5
    # 遥测电机数值 -> 电机转子 rad/s 的倍率；反馈里程计与静止判定共用。
    # 该遥测是异步状态流，不是 0x3A 命令 ACK。
    feedback_motor_scale_to_rad_s: 1.0
    # 电机转子速度一阶低通截止频率；在死区和正运动学之前抑制地面振动噪声。
    # 50 Hz 遥测下 8 Hz 兼顾约 20 ms 量级响应与里程计速度稳定性。
    motor_feedback_lowpass_cutoff_hz: 8.0
    motor_reduction_ratio: [19.0, 19.0, 19.0]
    # 遥测电机转子 rad/s 静止死区。
    # 0.20 rad/s 对应轮输出约 0.0105 rad/s，仅抑制零速附近的微小编码器抖动。
    motor_feedback_deadband_rad_s: [0.20, 0.20, 0.20]

    # 实车几何：203 mm 轮径；中心到轮心距离 322.56 mm。
    wheel_radius_m: 0.1015
    wheel_center_distance_m: 0.32256
    # 轮输出轴物理上限；多轴合成超限时保持 Twist 方向等比例缩放。
    max_wheel_speed_rad_s: 8.0

    # /cmd_vel 入口限幅：分别对应前后、左右和旋转速度的绝对值上限。
    max_linear_speed_m_s: 0.8
    max_lateral_speed_m_s: 0.8
    max_angular_speed_rad_s: 1.5
    # 底盘三轴物理加速度上限，供 Nav2 限速链路契约检查。
    max_linear_acceleration_m_s2: 0.40
    max_lateral_acceleration_m_s2: 0.40
    max_angular_acceleration_rad_s2: 1.00

    # 测量协方差对角线（方差，不是标准差），顺序均为 x、y、z。
    # Z 轴启动时使用以下保守值，连续静止样本达到门槛后再切换为在线估计。
    wheel_pose_variance: [0.10, 0.10, 0.20]
    wheel_twist_variance: [0.02, 0.02, 0.04]
    # incident_20260818_150324 的 yaw 相邻差分 var/2≈1.1e-9 rad²，但长静止段
    # lag-1≈0.99，差分法会低估绝对航向不确定度约 100~400 倍，因此启动值保持保守。
    imu_orientation_variance: [0.05, 0.05, 0.001]
    # 发布连续 yaw（节点包含 -π/π 展开与线性漂移估计）。
    imu_publish_orientation: true
    # Z 轴实测原始方差乘 1.69² 后约 5e-5~6e-5；取 1e-4 覆盖量程与动态误差。
    imu_angular_velocity_variance: [0.01, 0.01, 1.0e-4]
    # 在线估计仅使用完整连续静止区间：yaw 跨 ±pi 展开后，用线性回归残差估计
    # 去除线性漂移后的绝对角度方差；gyro_z 使用 Welford 样本方差。每满 500 个
    # 样本提交一次非重叠窗口，禁止同一批数据在后续每帧被重复加权。
    imu_covariance_calibration_samples: 500
    # 单次静止窗口不能证明绝对偏置和长期漂移；yaw 下限保留约 0.57° 标准差。
    imu_yaw_variance_floor: 1.0e-4
    imu_gyro_z_variance_floor: 1.0e-4
    # 静止窗口完成后以 EMA 更新已提交值；运动只清窗口，不丢弃上次可信方差。
    imu_covariance_update_alpha: 0.02
    # C 板加速度静止均值约 [-7.87, 0.05, -5.86]、模长 9.81，安装轴尚未
    # 标定到 ROS 机体系；本轮只发布原始值，EKF 不融合 ax/ay/az。
    imu_linear_acceleration_variance: [0.10, 0.10, 0.10]

    # yaw 零漂补偿：静止时自动标定并持续跟踪漂移率，实时补偿累积误差
    imu_yaw_drift_compensation: true               # 启用 yaw 零漂补偿
    imu_yaw_drift_time_constant_s: 300.0           # EMA 时间常数(s)，5分钟
    imu_yaw_drift_max_rate_rad_s: 0.0001           # 最大漂移率(rad/s)，约 0.36 rad/小时
    imu_yaw_drift_calibration_samples: 500         # 初始标定样本数（50Hz 下 10 秒）

    # 下位机 gyro_z 为逆时针负，ROS 要求逆时针正，因此只翻转 Z 轴。
    imu_angular_velocity_sign: [1.0, 1.0, -1.0]
    # 旋转标定得到 C 板 Z 轴角速度约偏小 1/1.69；比例只作用于有效 IMU 测量。
    imu_angular_velocity_scale: [1.0, 1.0, 1.69]
    # 死区在零漂扣除和低通之后应用，阈值针对去零漂、乘 scale 后的残余噪声。
    # z 轴按 incident_20260814_101732 静止段实测调整：去零漂后 ×1.69 的残余
    # 噪声 max≈0.028、std≈0.007，0.015 会泄漏 2.4%，0.025 仅 0.4%。
    # 2026-08-14 下午实测：0.025 死区仍有正偏置泄漏导致 AMCL 静止时 CCW 漂移；
    # 提高到 0.050（约 1.8×max）以完全覆盖温漂范围，代价是 <0.05 rad/s 的极慢
    # 旋转无法反馈，实际最低操作速度 ≥0.4 rad/s，影响可忽略。
    imu_angular_velocity_deadband_rad_s: [0.015, 0.015, 0.050]
    # 陀螺零漂处理：上电后累计 100 个静止样本（50 Hz 下约 2 s）取均值作为
    # 初始零漂；此后仅在静止时按 EMA 缓慢跟踪温漂，运动样本从不参与估计。
    # 时间常数从 30s 缩短到 10s，使偏置估计更快跟上温漂变化。
    imu_gyro_calibration_samples: 100
    imu_gyro_bias_time_constant_s: 10.0
    # 零漂估计的绝对值上限；超出说明传感器异常，钳制以防污染角速度。
    imu_gyro_max_bias_rad_s: 0.05
    # 一阶低通截止频率；50 Hz 反馈下 10 Hz 保留机动响应并抑制高频抖动。
    imu_gyro_lowpass_cutoff_hz: 10.0
    # 连续满足命令、电机、yaw 变化率和加速度模长静止后，才允许更新 IMU
    # 漂移/方差。实测遥测间隔 20~24 ms，超过 0.10 s 视为断流并清空当前窗口；
    # 已提交协方差不清零，避免 EKF 权重在断流恢复后跳变。
    imu_stationary_hold_s: 0.5
    imu_max_sample_gap_s: 0.10
    # 底盘 yaw 静止漂移远小于 0.02 rad/s；该门限用于拒绝人工推动/抬车旋转。
    imu_stationary_yaw_rate_threshold_rad_s: 0.02
    # 安装倾角不改变加速度模长；偏离标准重力超过 0.50 m/s² 的振动样本不参与标定。
    imu_stationary_acceleration_tolerance_m_s2: 0.50
    # 顺序为 vx(m/s)、vy(m/s)、wz(rad/s)，过滤静止编码器抖动后再积分和发布。
    wheel_twist_deadband: [0.015, 0.015, 0.022]

    # 轮组解析坐标相对 ROS 机体坐标固定逆时针偏置 180 度；该偏置已经由
    # KiwiKinematics 正逆解成对处理，不能再在 cmd_vel、odom 或 TF 中重复旋转。

    # Nav2、键盘或测试脚本统一向底盘速度入口发布 Twist。
    cmd_vel_topic: /cmd_vel
    wheel_odom_topic: /chassis/odom/raw
    imu_topic: /chassis/imu/data_raw
    # 仅在 gyro bias、yaw 漂移和静止方差均完成首个连续窗口后置 true。
    # transient-local QoS 允许后启动的建图门控立即取得最近状态。
    imu_calibration_ready_topic: /chassis/imu/calibration_ready
    # 0x3B 解码调试消息；字段为电机、欧拉角、原始角速度、原始加速度。
    feedback_debug_topic: /chassis/feedback/raw
    joint_states_topic: /joint_states

    # ROS 坐标和关节名称。
    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: chassis_imu_link
    wheel_names: [wheel_joint_1, wheel_joint_2, wheel_joint_3]

# 命令链无 ACK；电机/IMU 遥测独立非阻塞接收，里程计只使用滤波后的电机实测速度。

# 平面 EKF：融合电机反馈速度与 C 板绝对 yaw/gyro_z，发布 odom -> base_footprint TF。
ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.20
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    # EKF 独占 odom -> base_footprint；SLAM/定位模块负责 map -> odom。
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 状态顺序固定为：
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /chassis/odom/raw
    odom0_config: [
      false, false, false,  # x, y, z：不重复融合轮速积分位置
      false, false, false,  # roll, pitch, yaw：不使用轮式积分姿态
      true,  true,  false,  # vx, vy, vz：融合全向底盘平面线速度
      false, false, true,   # vroll, vpitch, vyaw：融合轮速正解的 wz
      false, false, false   # ax, ay, az：轮式里程计不提供加速度
    ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # C 板 yaw 已在事故包中验证为低漂、近似线性，直接作为绝对航向约束；gyro_z
    # 保留机动响应。阈值放宽到 5.0，避免打滑时把真正的绝对 yaw 纠偏误拒绝。
    imu0: /chassis/imu/data_raw
    imu0_config: [
      false, false, false,  # x, y, z：IMU 不提供位置
      false, false, true,   # roll, pitch, yaw：直接融合底盘绝对 yaw
      false, false, false,  # vx, vy, vz：IMU 不提供线速度
      false, false, true,   # vroll, vpitch, vyaw：融合 z 轴角速度
      false, false, false   # ax, ay, az：当前平面 EKF 不融合加速度
    ]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_pose_rejection_threshold: 5.0
    imu0_twist_rejection_threshold: 5.0

# 键盘节点不再在 C++ 中保存速度默认值，修改手动控制速度只改这里。
kiwi_teleop_keyboard:
  ros__parameters:
    # 键盘与 Nav2 使用同一个底盘速度入口；两者不要同时控制机器人。
    cmd_vel_topic: /cmd_vel
    # 键盘只声明期望速度，唯一限幅在 kiwi_base_node 的 max_*；
    # 这里的数值不得超过上面的限幅，否则会被静默截断（有 pytest 契约保护）。
    speed_m_s: 0.4
    yaw_rad_s: 0.4
    deadman_timeout_ms: 200

# 滤波里程计终端调试节点。
kiwi_odom_test:
  ros__parameters:
    odom_topic: /odometry/filtered

# 只供结构描述和兼容工具读取的底盘尺寸；传感器安装外参不放在这里。
# base_radius_m 历史字段实际表示“中心到轮心距离”，不是 Nav2 的机身外接半径。
# Nav2 的安全半径单独维护在 kiwi_navigation/config/nav2.yaml。
kiwi_robot_model:
  ros__parameters:
    base_z_m: 0.0
    base_radius_m: 0.32256
    base_height_m: 0.08
    base_mass_kg: 10.0
    base_inertia_kg_m2: [0.18, 0.18, 0.35]
    wheel_width_m: 0.04
    lidar_visual_radius_m: 0.01925
    lidar_visual_height_m: 0.0337
