# Kiwi 底盘唯一参数入口（ROS 2 Humble）。
# 底盘、EKF、键盘、调试节点和结构尺寸均在本文件维护。
kiwi_base_node:
  ros__parameters:
    use_sim_time: false
    # USB CDC 设备。没有硬件时节点仍可启动，但不会产生 TX 日志。
    device: /dev/robomaster_c
    publish_rate: 50.0
    # 结构化反馈话题已包含调试字段；关闭逐帧终端日志，避免 I/O 造成运行卡顿。
    log_serial_frames: false
    # 现场 C 板不发送 0x33/0x3B/CRC 帧，只连续输出 48 字节 float32 payload。
    feedback_framed: false

    # 反馈电机数值 -> 轮输出轴 rad/s 的倍率。
    # 若 C 板回传的是电机轴 rad/s，保持 1.0；主机随后除以 19。
    feedback_motor_scale_to_rad_s: 1.0
    motor_reduction_ratio: [19.0, 19.0, 19.0]
    # C 板回传的电机转子 rad/s 静止死区；先过滤电机反馈，再做减速比换算和正解。
    # 0.20 rad/s 对应轮输出约 0.0105 rad/s，仅抑制零速附近的微小编码器抖动。
    motor_feedback_deadband_rad_s: [0.20, 0.20, 0.20]

    # 实车几何：203 mm 轮径；中心到轮心距离 322.56 mm。
    wheel_radius_m: 0.1015
    wheel_center_distance_m: 0.32256

    # /cmd_vel 入口限幅：分别对应前后、左右和旋转速度的绝对值上限。
    max_linear_speed_m_s: 0.8
    max_lateral_speed_m_s: 0.8
    max_angular_speed_rad_s: 1.5

    # 测量协方差对角线（方差，不是标准差），顺序均为 x、y、z。
    # 当前是保守初值；完成静止和匀速采样后再用实测方差替换。
    wheel_pose_variance: [0.10, 0.10, 0.20]
    wheel_twist_variance: [0.02, 0.02, 0.04]
    imu_orientation_variance: [0.05, 0.05, 0.05]
    # 当前包显示 C 板绝对 yaw 在静止时持续漂移，完成六面标定前不发布姿态。
    imu_publish_orientation: false
    imu_angular_velocity_variance: [0.01, 0.01, 0.01]
    imu_linear_acceleration_variance: [0.10, 0.10, 0.10]

    # 下位机 gyro_z 为逆时针负，ROS 要求逆时针正，因此只翻转 Z 轴。
    imu_angular_velocity_sign: [1.0, 1.0, -1.0]
    # 本次静止样本绝对值最大约 0.012 rad/s；0.015 可阻止零偏持续积分。
    imu_angular_velocity_deadband_rad_s: [0.015, 0.015, 0.015]
    # 顺序为 vx(m/s)、vy(m/s)、wz(rad/s)，过滤静止编码器抖动后再积分和发布。
    wheel_twist_deadband: [0.015, 0.015, 0.022]

    # 轮组解析坐标相对 ROS 机体坐标固定逆时针偏置 180 度；该偏置已经由
    # KiwiKinematics 正逆解成对处理，不能再在 cmd_vel、odom 或 TF 中重复旋转。

    # Nav2、键盘或测试脚本统一向底盘速度入口发布 Twist。
    cmd_vel_topic: /cmd_vel
    wheel_odom_topic: /chassis/odom/raw
    imu_topic: /chassis/imu/data_raw
    # 0x3B 解码调试消息；字段为电机、欧拉角、原始角速度、原始加速度。
    feedback_debug_topic: /chassis/feedback/raw
    joint_states_topic: /joint_states

    # ROS 坐标和关节名称。
    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: chassis_imu_link
    wheel_names: [wheel_joint_1, wheel_joint_2, wheel_joint_3]

# 暂不启用：加速度斜坡、命令超时、反馈联锁和软件急停。

# 平面 EKF：融合轮式 vx/vy/wz 与 C 板 IMU 的 gyro_z；绝对 yaw 暂不可信。
ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.20
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    # EKF 独占 odom -> base_footprint；SLAM/定位模块负责 map -> odom。
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 状态顺序固定为：
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /chassis/odom/raw
    odom0_config: [
      false, false, false,  # x, y, z：不重复融合轮速积分位置
      false, false, false,  # roll, pitch, yaw：不使用轮式积分姿态
      true,  true,  false,  # vx, vy, vz：融合全向底盘平面线速度
      false, false, true,   # vroll, vpitch, vyaw：融合轮速正解的 wz
      false, false, false   # ax, ay, az：轮式里程计不提供加速度
    ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # C 板绝对 yaw 在静止时有明显漂移，先只使用符号修正后的 gyro_z。
    imu0: /chassis/imu/data_raw
    imu0_config: [
      false, false, false,  # x, y, z：IMU 不提供位置
      false, false, false,  # roll, pitch, yaw：待完成 IMU 安装轴/航向标定后再启用
      false, false, false,  # vx, vy, vz：IMU 不提供线速度
      false, false, true,   # vroll, vpitch, vyaw：只融合 z 轴角速度
      false, false, false   # ax, ay, az：当前平面 EKF 不融合加速度
    ]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_pose_rejection_threshold: 1.0
    imu0_twist_rejection_threshold: 1.0

# 键盘节点不再在 C++ 中保存速度默认值，修改手动控制速度只改这里。
kiwi_teleop_keyboard:
  ros__parameters:
    # 键盘与 Nav2 使用同一个底盘速度入口；两者不要同时控制机器人。
    cmd_vel_topic: /cmd_vel
    speed_m_s: 0.25
    yaw_rad_s: 0.8
    deadman_timeout_ms: 200

# 滤波里程计终端调试节点。
kiwi_odom_test:
  ros__parameters:
    odom_topic: /odometry/filtered

# 只供结构描述和兼容工具读取的底盘尺寸；传感器安装外参不放在这里。
# base_radius_m 历史字段实际表示“中心到轮心距离”，不是 Nav2 的机身外接半径。
# Nav2 的安全半径单独维护在 kiwi_navigation/config/nav2.yaml。
kiwi_robot_model:
  ros__parameters:
    base_z_m: 0.0
    base_radius_m: 0.32256
    base_height_m: 0.08
    base_mass_kg: 10.0
    base_inertia_kg_m2: [0.18, 0.18, 0.35]
    wheel_width_m: 0.04
    lidar_visual_radius_m: 0.01925
    lidar_visual_height_m: 0.0337
