# Kiwi 底盘硬件唯一参数入口（ROS 2 Humble）。
# 本文件只描述底盘、键盘、调试节点和结构尺寸；EKF 传感器选择放在独立 YAML。
kiwi_base_node:
  ros__parameters:
    use_sim_time: false
    # USB CDC 设备。没有硬件时节点仍可启动，但不会产生 TX 日志。
    device: /dev/robomaster_c
    publish_rate: 50.0
    log_serial_frames: false

    # 反馈电机数值 -> 轮输出轴 rad/s 的倍率。
    # 若 C 板回传的是电机轴 rad/s，保持 1.0；主机随后除以 19。
    feedback_motor_scale_to_rad_s: 1.0
    motor_reduction_ratio: [19.0, 19.0, 19.0]

    # 实车几何：203 mm 轮径；中心到轮心距离 322.56 mm。
    wheel_radius_m: 0.1015
    wheel_center_distance_m: 0.32256

    # /cmd_vel_safe 入口限幅：分别对应前后、左右和旋转速度的绝对值上限。
    max_linear_speed_m_s: 0.6
    max_lateral_speed_m_s: 0.6
    max_angular_speed_rad_s: 1.5

    # 测量协方差对角线（方差，不是标准差），顺序均为 x、y、z。
    # 当前是保守初值；完成静止和匀速采样后再用实测方差替换。
    wheel_pose_variance: [0.10, 0.10, 0.20]
    wheel_twist_variance: [0.02, 0.02, 0.04]
    imu_orientation_variance: [0.05, 0.05, 0.05]
    imu_angular_velocity_variance: [0.01, 0.01, 0.01]
    imu_linear_acceleration_variance: [0.10, 0.10, 0.10]

    # 下位机 gyro_z 为逆时针负，ROS 要求逆时针正，因此只翻转 Z 轴。
    imu_angular_velocity_sign: [1.0, 1.0, -1.0]
    # 本次静止样本绝对值最大约 0.012 rad/s；0.015 可阻止零偏持续积分。
    imu_angular_velocity_deadband_rad_s: [0.015, 0.015, 0.015]
    # 顺序为 vx(m/s)、vy(m/s)、wz(rad/s)，过滤静止编码器抖动后再积分和发布。
    wheel_twist_deadband: [0.015, 0.015, 0.022]

    # ROS 话题入口；Nav2、键盘或测试脚本只需要发布 cmd_vel_topic。
    cmd_vel_topic: /cmd_vel_safe
    wheel_odom_topic: /chassis/odom/raw
    imu_topic: /chassis/imu/data_raw
    # 0x3B 解码调试消息；字段为电机、欧拉角、原始角速度、原始加速度。
    feedback_debug_topic: /chassis/feedback/raw
    joint_states_topic: /joint_states

    # ROS 坐标和关节名称。
    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: chassis_imu_link
    wheel_names: [wheel_joint_1, wheel_joint_2, wheel_joint_3]

# 暂不启用：加速度斜坡、命令超时、反馈联锁和软件急停。

# 键盘节点不再在 C++ 中保存速度默认值，修改手动控制速度只改这里。
kiwi_teleop_keyboard:
  ros__parameters:
    use_sim_time: false
    cmd_vel_topic: /cmd_vel_safe
    speed_m_s: 0.25
    yaw_rad_s: 0.8
    deadman_timeout_ms: 500

# 滤波里程计终端调试节点。
kiwi_odom_test:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odometry/filtered

# 只供 Xacro 读取的底盘结构尺寸；传感器安装外参不放在这里。
# IMU 和雷达相对 base_link 的安装标定只维护 urdf/kiwi.urdf.xacro。
kiwi_robot_model:
  ros__parameters:
    base_z_m: 0.0
    base_radius_m: 0.32256
    base_height_m: 0.08
    base_mass_kg: 10.0
    base_inertia_kg_m2: [0.18, 0.18, 0.35]
    wheel_width_m: 0.04
    lidar_visual_radius_m: 0.01925
    lidar_visual_height_m: 0.0337
