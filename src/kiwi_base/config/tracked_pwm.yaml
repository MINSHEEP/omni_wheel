# 两电机履带平台。直线速度换算使用 2026-09-24 地面实测及用户确认的标定值。
# motor1=左履带、motor2=右履带、motor3=0；沿用 C 板 0x3A/0x3B 协议。
tracked_base_node:
  ros__parameters:
    device: /dev/robomaster_c
    cmd_vel_topic: /cmd_vel
    imu_topic: /chassis/imu/data_raw
    imu_frame_id: chassis_imu_link
    publish_rate: 50.0
    cmd_vel_timeout_s: 0.20
    max_linear_speed_m_s: 0.30
    max_angular_speed_rad_s: 0.95
    # 2026-09-23 实测左右履带中心距 50 cm。
    track_separation_m: 0.50
    # 2026-09-24 地面直线初测：1.6 m，命令 5 用 6.85 s -> 21.406；
    # 命令 10 用 3.37 s -> 21.063；取两档均值 21.2 固件命令值/(m/s)。
    # 低速起步、反向和转向仍需在首次导航时观察；标定倍率由用户确认为 21.2。
    command_per_m_s: 21.2
    # 已核对固件 robot_param_pwm_diff.h: PWM_DIFF_USB_MAX_COMMAND=20 rad/s。
    max_motor_command: 20.0
    # C 板 IMU z 轴符号和倍率沿用原车实测值；更换惯导时重新标定。
    gyro_z_sign: -1.0
    gyro_z_scale: 1.69
    # 2026-09-24 两份 bag 和 2026-09-25 重启后 55 s 静止实测均值约 -0.0035 rad/s。
    # 只扣除 ROS z 轴角速度的静止均值；更换 IMU 或安装后必须重新静止测量。
    gyro_z_bias_rad_s: -0.00355
    gyro_z_variance: 0.01
    # 2026-09-24 受控遥控 bag 已核对安装 TF、IMU/RF2O 双向转角与静止漂移；允许手动建图。
    # 传感器链路与运动标定分别由各自开关表示。
    mapping_sensors_verified: true
    hardware_calibrated: true
    enable_motion: true
    # 常规运动启用时关闭临时键盘试车；以下倍率和限幅仅供再次切回试车模式时使用。
    keyboard_trial_enabled: false
    keyboard_trial_command_gain: 21.2
    keyboard_trial_limit_rad_s: 5.0
    # 重新使用原始电机话题前，须同时关闭正常运动和键盘试车，再将此项设为 true。
    open_loop_test_enabled: false
    open_loop_test_topic: /chassis/open_loop_motor_cmd
    open_loop_test_limit_rad_s: 10.0

ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    # 唯一公共 TF 由 tracked_estimation_guard 在估计有效时转发。
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /chassis/odom/laser
    # 激光里程计提供平面位姿/线速度，绝不使用固件 0x3B 的全零电机字段。
    odom0_config: [
      true, true, false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 10
    # 仅在背景确认停车时产生的零速度约束；运动/退化时该话题停止更新。
    odom1: /chassis/odom/stationary
    odom1_config: [false, false, false, false, false, false,
                   true, true, false, false, false, false, false, false, false]
    odom1_queue_size: 5
    # 全方向激光位姿不可用时，仅接收可信方向的相邻扫描速度，弱方向给大协方差。
    # 与完整laser观测互斥，不把同源INS再次计入EKF，也不刷新完整位姿锚点。
    odom2: /chassis/odom/laser_partial
    odom2_config: [false, false, false, false, false, false,
                   true, true, false, false, false, true, false, false, false]
    odom2_queue_size: 5
    imu0: /chassis/imu/gyro
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 20
    # 同一激光来源的位姿和速度不重复提供独立信息；保留位姿，速度由惯性模型预测。
    print_diagnostics: true
    # yaw 保持原有驱动转换；第二路仅融合已去重力、已补偿 8 cm 杆臂的平面加速度。
    imu1: /chassis/imu/acceleration
    imu1_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false,
      true, true, false
    ]
    imu1_queue_size: 20
    imu1_remove_gravitational_acceleration: false

tracked_imu_acceleration:
  ros__parameters:
    # 2026-09-25 静止合量 + 09-24 直线启停方向标定；仅适用于固定平放。
    # 17 个直线窗口相关性 0.957；未拟合比例系数，尚待独立实车地图精度验收。
    enabled: true
    startup_calibration_enabled: true
    startup_duration_s: 10.0
    recovery_duration_s: 0.3
    max_interruption_s: 2.0
    data_ready_topic: /chassis/imu/data_ready
    gyro_variance_floor: 0.001
    gyro_output_topic: /chassis/imu/gyro
    ready_topic: /chassis/imu/calibration_ready
    stationary_topic: /chassis/odom/calibration_stationary
    source_topic: /chassis/imu/data_raw
    source_frame: chassis_imu_link
    output_topic: /chassis/imu/acceleration
    output_frame: base_footprint
    accel_rotation: [-0.6000943129, -0.0021309532, 0.7999264183,
                      0.0001200478, 0.9999962006, 0.0027539847,
                     -0.7999292476, 0.0017486800, -0.6000917771]
    rest_acceleration: [-7.8902080586, 0.0172483369, -5.9190847056]
    acceleration_variance: [0.04, 0.04, 0.04]
    imu_lever_xy: [0.08, 0.0]
    # 单帧平面加速度突刺先隔离并增大方差；连续同向样本会确认真实运动。
    # 只处理加速度，不更改 gyro_z、原始时间戳或串口断流判断。
    acceleration_spike_threshold_m_s2: 0.8
    acceleration_smoothing_time_constant_s: 0.04
    acceleration_suspect_variance_scale: 25.0

tracked_robot_model:
  ros__parameters:
    # 长宽、履带中心距及下方传感器相对 base_link 位姿已确认；机身高度、履带尺寸和质量仍为 TODO。
    base_length_m: 0.70
    base_width_m: 0.59
    base_height_m: 0.15
    base_z_m: 0.15
    track_width_m: 0.10
    track_height_m: 0.10
    mass_kg: 15.0
    # 2026-09-24 确认相对 base_link：雷达前方 24 cm、IMU 前方 8 cm；轴向同原车，z=0。
    lidar_xyz: [0.24, 0.0, 0.0]
    lidar_rpy: [0.0, 0.0, 0.0]
    imu_xyz: [0.08, 0.0, 0.0]
    imu_rpy: [0.0, 0.0, 0.0]

# 复用同一个键盘节点；只发送 /cmd_vel，履带不能横移。
kiwi_teleop_keyboard:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    speed_m_s: 0.235
    yaw_rad_s: 0.95
    deadman_timeout_ms: 200

# EKF 候选异常时短时改用经质量核验的激光；激光不可用时由独立 INS
# 有界续接公共里程计/TF。两路观测都失效时停止发布有效定位。
tracked_estimation_guard:
  ros__parameters:
    input_topic: /chassis/odometry/filtered_unchecked
    output_topic: /odometry/filtered
    laser_topic: /chassis/odom/laser
    gyro_topic: /chassis/imu/gyro
    imu_ready_topic: /chassis/imu/data_ready
    laser_ready_topic: /chassis/odom/laser_ready
    valid_topic: /chassis/estimation/valid
    state_topic: /chassis/estimation/state
    toggle_service: /chassis/ekf/toggle
    set_pose_service: /chassis/ekf/set_pose
    odom_frame: odom
    base_frame: base_footprint
    max_prediction_s: 0.2
    # 激光质量短暂抖动且独立 INS 不可用时，最后可信位姿仅由新鲜陀螺
    # 和常速度模型续推 0.45 s；这一状态不允许写地图。
    max_prediction_hold_s: 0.45
    max_measurement_age_s: 0.35
    recovery_duration_s: 0.3
    # 延迟传播的保守模型误差预算；不是实测加速度标定或执行器指令。
    prediction_acceleration_bound_m_s2: 1.5
    prediction_yaw_acceleration_bound_rad_s2: 2.0
    # 故障包里激光里程计常见单轴标准差约 0.5 m；0.25 m 绝对阈值
    # 会把正常滤波差异误当硬故障。这里仍保留保守的 0.35 m 隔离阈值。
    max_position_error_m: 0.35
    # 源切换用偏移连续衔接并传播不确定度，不直接跳变 0.5 m。
    max_handoff_position_error_m: 0.5
    max_yaw_error_rad: 0.15
    inertial_enabled: true
    inertial_topic: /chassis/odom/inertial
    inertial_valid_topic: /chassis/inertial/valid
    max_inertial_duration_s: 2.0
    # 104124 故障包持续失配最长约 2.6 s；3 s 后若 INS 仍有效则转 INS，
    # 否则停止有效定位，不无限放行单源建图。
    max_laser_fallback_s: 3.0
    max_inertial_xy_variance: 4.0
    max_inertial_xy_growth_variance: 0.09
    max_inertial_yaw_growth_variance: 0.05
    handoff_correction_speed_m_s: 0.05
    handoff_correction_yaw_rate_rad_s: 0.10
    max_inertial_yaw_variance: 0.15

# 独立短时平面惯性推算：从可信激光锚定位置/速度，积分校准后的 ax/ay/wz。
# 不发布 TF，不反向融合到 EKF；以下为保护上限而非实车精度承诺。
tracked_inertial_odometry:
  ros__parameters:
    odom_frame: odom
    base_frame: base_footprint
    gyro_topic: /chassis/imu/gyro
    acceleration_topic: /chassis/imu/acceleration
    anchor_topic: /chassis/odom/laser
    partial_topic: /chassis/odom/laser_partial
    partial_ready_topic: /chassis/odom/laser_partial_ready
    partial_max_velocity_variance: 0.25
    partial_velocity_innovation_limit_m_s: 0.3
    laser_ready_topic: /chassis/odom/laser_ready
    imu_ready_topic: /chassis/imu/data_ready
    output_topic: /chassis/odom/inertial
    valid_topic: /chassis/inertial/valid
    state_topic: /chassis/inertial/state
    reason_topic: /chassis/inertial/reason
    max_coast_s: 2.0
    max_imu_gap_s: 0.20
    max_measurement_age_s: 0.35
    gyro_sync_tolerance_s: 0.05
    anchor_window_s: 0.45
    anchor_min_span_s: 0.25
    anchor_min_samples: 4
    anchor_max_gap_s: 0.25
    anchor_fit_residual_m: 0.02
    max_speed_m_s: 0.8
    max_yaw_rate_rad_s: 1.8
    max_acceleration_m_s2: 1.5
    velocity_variance_floor: 0.01
    acceleration_bias_std: 0.05
    gyro_bias_std: 0.01
    # 正常预算4m²；继承的全局锚点方差高于预算时保留原值，严格限制新增误差。
    max_position_variance: 4.0
    # 额外xy方差最多0.09m²（额外1sigma最多0.30m），同时受2秒限制。
    max_position_growth_variance: 0.09
    max_velocity_variance: 0.5
    max_yaw_variance: 0.15
    max_yaw_growth_variance: 0.05
