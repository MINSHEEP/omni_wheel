# 两电机履带平台。TODO 标定后才能把 hardware_calibrated 和 enable_motion 改为 true。
# motor1=左履带、motor2=右履带、motor3=0；沿用 C 板 0x3A/0x3B 协议。
tracked_base_node:
  ros__parameters:
    device: /dev/robomaster_c
    cmd_vel_topic: /cmd_vel
    imu_topic: /chassis/imu/data_raw
    imu_frame_id: chassis_imu_link
    publish_rate: 50.0
    cmd_vel_timeout_s: 0.20
    max_linear_speed_m_s: 0.30
    max_angular_speed_rad_s: 0.80
    # 2026-09-23 实测左右履带中心距 50 cm。
    track_separation_m: 0.50
    # TODO 标定 1 m/s 对应固件 motor1/motor2 命令数值，包含减速比及 PWM 映射。
    command_per_m_s: 0.0
    # 已核对固件 robot_param_pwm_diff.h: PWM_DIFF_USB_MAX_COMMAND=20 rad/s。
    max_motor_command: 20.0
    # C 板 IMU z 轴符号和倍率沿用原车实测值；更换惯导时重新标定。
    gyro_z_sign: -1.0
    gyro_z_scale: 1.69
    gyro_z_variance: 0.01
    # TODO 核验雷达/惯导外参、IMU 轴向、RF2O 静止漂移后才允许手动建图。
    mapping_sensors_verified: false
    hardware_calibrated: false
    enable_motion: false
    # 仅供 driver 模式原始电机命令试车；/cmd_vel 仍锁定。
    open_loop_test_enabled: true
    open_loop_test_topic: /chassis/open_loop_motor_cmd
    open_loop_test_limit_rad_s: 10.0

ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /chassis/odom/laser
    # 激光里程计提供平面位姿/线速度，绝不使用固件 0x3B 的全零电机字段。
    odom0_config: [
      true, true, false,
      false, false, true,
      true, true, false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 10
    imu0: /chassis/imu/data_raw
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 20

tracked_robot_model:
  ros__parameters:
    # 机身长宽、履带中心距已实测；高度、履带尺寸、质量和外参仍为 TODO。
    base_length_m: 0.70
    base_width_m: 0.59
    base_height_m: 0.15
    base_z_m: 0.15
    track_width_m: 0.10
    track_height_m: 0.10
    mass_kg: 15.0
    lidar_xyz: [0.20, 0.0, 0.20]
    lidar_rpy: [0.0, 0.0, 0.0]
    imu_xyz: [0.0, 0.0, 0.0]
    imu_rpy: [0.0, 0.0, 0.0]

# 复用同一个键盘节点；只发送 /cmd_vel，履带不能横移。
kiwi_teleop_keyboard:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    speed_m_s: 0.10
    yaw_rad_s: 0.30
    deadman_timeout_ms: 200

# 履带专属建图门控设置，与底盘参数放在同一 YAML。
kiwi_mapping_scan_gate:
  ros__parameters:
    use_sim_time: false
    input_scan_topic: /scan
    output_scan_topic: /scan_slam
    odom_topic: /odometry/filtered
    imu_ready_topic: /chassis/imu/calibration_ready
    gate_ready_topic: /kiwi_slam/mapping_gate_ready
    laser_frame: lidar_link
    odom_frame: odom
    base_frame: base_footprint
    # 履带平台无电机反馈；用激光里程计静止证据，不等待原 Kiwi 电机标定 Bool。
    require_imu_ready: false
    # 履带不发布原 Kiwi 的电机标定 Bool；开门和持续转发仍要求新鲜 IMU 与 RF2O。
    require_imu_samples: true
    imu_topic: /chassis/imu/data_raw
    imu_frame: chassis_imu_link
    require_source_odom: true
    source_odom_topic: /chassis/odom/laser
    stationary_duration_s: 0.5
    max_linear_speed_m_s: 0.02
    max_angular_speed_rad_s: 0.03
    max_yaw_step_rad: 0.01
    max_message_age_s: 0.20
    required_stable_scans: 8
    min_valid_scan_ratio: 0.10
    min_scan_overlap_ratio: 0.50
    max_median_range_delta_m: 0.05

# 履带专属 Nav2 差速模型与外形参数；其余参数共用 nav2.yaml。
amcl:
  ros__parameters:
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.40
    alpha2: 0.40
    alpha3: 0.40
    alpha4: 0.40
    # 差速模型不使用 alpha5；四项噪声系数待实测扫描匹配质量后复核。
local_costmap:
  local_costmap:
    ros__parameters:
      # 70×59 cm 外接圆约 0.458 m；先留余量，最终按完整外形复核。
      robot_radius: 0.48
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.48

# 履带 Nav2 专属值：保留公共算法/话题；下列速度和加速度只是待标定的保守上限，
# hardware_calibrated=false 时禁止导航，不能把这些数值当成实测运动能力。
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.12
      required_movement_angle: 0.15
      movement_time_allowance: 15.0
    general_goal_checker:
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.40
    FollowPath:
      min_vel_x: 0.0
      max_vel_x: 0.15
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.40
      max_speed_xy: 0.15
      rotate_to_heading_angular_vel: 0.30
      max_angular_accel: 0.40
      acc_lim_x: 0.15
      decel_lim_x: -0.20
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 0.40
      decel_lim_theta: -0.60
      vx_samples: 8
      vy_samples: 1
      vtheta_samples: 16
      sim_time: 1.2
smoother_server:
  ros__parameters:
    constrained_smoother:
      # 履带可原地转向，不沿用 Kiwi 的 0.40 m 最小转弯半径。
      minimum_turning_radius: 0.0
      w_curve: 0.0
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.40
    rotational_acc_lim: 0.40
velocity_smoother:
  ros__parameters:
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.0, 0.40]
    min_velocity: [0.0, 0.0, -0.40]
    max_accel: [0.15, 0.0, 0.40]
    max_decel: [-0.20, 0.0, -0.60]
    velocity_timeout: 0.20
