# 两电机履带平台。直线倍率已有初测；低速、转向和传感器未核验，正常运动仍锁定。
# motor1=左履带、motor2=右履带、motor3=0；沿用 C 板 0x3A/0x3B 协议。
tracked_base_node:
  ros__parameters:
    device: /dev/robomaster_c
    cmd_vel_topic: /cmd_vel
    imu_topic: /chassis/imu/data_raw
    imu_frame_id: chassis_imu_link
    publish_rate: 50.0
    cmd_vel_timeout_s: 0.20
    max_linear_speed_m_s: 0.30
    max_angular_speed_rad_s: 0.95
    # 2026-09-23 实测左右履带中心距 50 cm。
    track_separation_m: 0.50
    # 2026-09-24 地面直线初测：1.6 m，命令 5 用 6.85 s -> 21.406；
    # 命令 10 用 3.37 s -> 21.063；取两档均值 21.2 固件命令值/(m/s)。
    # 尚未验证低速死区、反向和转向；hardware_calibrated=false 时此倍率不解锁运动。
    command_per_m_s: 21.2
    # 已核对固件 robot_param_pwm_diff.h: PWM_DIFF_USB_MAX_COMMAND=20 rad/s。
    max_motor_command: 20.0
    # C 板 IMU z 轴符号和倍率沿用原车实测值；更换惯导时重新标定。
    gyro_z_sign: -1.0
    gyro_z_scale: 1.69
    gyro_z_variance: 0.01
    # TODO 核验雷达/惯导外参、IMU 轴向、RF2O 静止漂移后才允许手动建图。
    mapping_sensors_verified: false
    hardware_calibrated: false
    enable_motion: false
    # 受限键盘试车使用直线初测倍率；前进/后退约输出 ±4.98，q/e 原地转向输出 -5/+5 或 +5/-5。
    # 遥控器可后退/转向；键盘旧档前进慢、转向有反应、后退不动。负向起步仍待实测。
    keyboard_trial_enabled: true
    keyboard_trial_command_gain: 21.2
    keyboard_trial_limit_rad_s: 5.0
    # 原始电机话题与键盘试车互斥；需要原始试车时将上面开关设 false、此处设 true。
    open_loop_test_enabled: false
    open_loop_test_topic: /chassis/open_loop_motor_cmd
    open_loop_test_limit_rad_s: 10.0

ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /chassis/odom/laser
    # 激光里程计提供平面位姿/线速度，绝不使用固件 0x3B 的全零电机字段。
    odom0_config: [
      true, true, false,
      false, false, true,
      true, true, false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 10
    imu0: /chassis/imu/data_raw
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 20

tracked_robot_model:
  ros__parameters:
    # 长宽、履带中心距及下方传感器相对 base_link 位姿已确认；机身高度、履带尺寸和质量仍为 TODO。
    base_length_m: 0.70
    base_width_m: 0.59
    base_height_m: 0.15
    base_z_m: 0.15
    track_width_m: 0.10
    track_height_m: 0.10
    mass_kg: 15.0
    # 2026-09-24 确认相对 base_link：雷达前方 24 cm、IMU 前方 8 cm；轴向同原车，z=0。
    lidar_xyz: [0.24, 0.0, 0.0]
    lidar_rpy: [0.0, 0.0, 0.0]
    imu_xyz: [0.08, 0.0, 0.0]
    imu_rpy: [0.0, 0.0, 0.0]

# 复用同一个键盘节点；只发送 /cmd_vel，履带不能横移。
kiwi_teleop_keyboard:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    speed_m_s: 0.235
    yaw_rad_s: 0.95
    deadman_timeout_ms: 200
