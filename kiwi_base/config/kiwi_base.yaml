# Kiwi 三轮全向底盘的唯一运行时参数文件，包含通信、安全和运动学配置。
kiwi_base_node:
  ros__parameters:
    transport: usb_cdc
    device: /dev/robomaster_c
    protocol_version: 51  # 0x33，帧同步/协议版本字节
    command_timeout_ms: 100
    feedback_timeout_ms: 150
    reconnect_interval_ms: 1000
    publish_rate: 50.0
    max_wheel_speed_rad_s: 30.0
    # 主机安全限幅；30 rad/s 是轮输出轴保守运行上限，不是电机规格极限。
    max_linear_speed_m_s: 0.6
    max_lateral_speed_m_s: 0.6
    max_angular_speed_rad_s: 1.5
    max_accel_m_s2: 0.8
    max_decel_m_s2: 1.2
    max_yaw_accel_rad_s2: 2.0
    max_yaw_decel_rad_s2: 3.0
    cmd_vel_topic: /cmd_vel_safe
    wheel_odom_topic: /wheel/odom
    imu_topic: /imu/data_raw
    joint_states_topic: /joint_states
    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: imu_link
    estop_topic: /kiwi/estop
    # 运行时只需加载本文件；下面是当前已知的 Kiwi 三轮几何初值。
    # 轮 1 在 +y，底盘中心到轮心 0.32256 m，轮直径 0.203 m。
    wheel_positions_m: [0.0, 0.32256, -0.279345154, -0.16128, 0.279345154, -0.16128]
    wheel_tangent_angles_deg: [0.0, 120.0, 240.0]
    wheel_radius_m: [0.1015, 0.1015, 0.1015]
    wheel_sign: [1, 1, 1]
    motor_reduction_ratio: [19.0, 19.0, 19.0]
    wheel_names: [wheel_joint_1, wheel_joint_2, wheel_joint_3]
