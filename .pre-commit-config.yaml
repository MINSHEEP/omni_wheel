# 第三方驱动保持上游排版，项目自有源码执行格式与静态检查。
exclude: ^(build/|install/|log/|src/lslidar_driver/)
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        # 既有底盘源码沿用历史 Allman 排版；新文件及后续代码执行统一格式。
        exclude: >-
          (?x)^src/kiwi_base/(
          include/kiwi_base/(kiwi_kinematics|measurement_processing|robomaster_protocol)\.hpp|
          src/(kiwi_base_node|kiwi_kinematics|kiwi_odom_test|kiwi_teleop_keyboard|measurement_processing|robomaster_protocol)\.cpp|
          test/(test_kinematics|test_measurement_processing|test_protocol)\.cpp
          )$

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203,W503]
        types: [python]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]
